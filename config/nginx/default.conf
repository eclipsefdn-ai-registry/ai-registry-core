server {
    listen       8080;
    server_name  localhost;
    port_in_redirect off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # The AI Registry API is entirely public, read-only static JSON, so a
        # permissive CORS policy is appropriate for browser-based consumers.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;

        # Answer CORS preflight requests directly; serving static files
        # otherwise rejects OPTIONS with 405 Method Not Allowed.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
    }

    error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
